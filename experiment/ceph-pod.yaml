apiVersion: v1
kind: Pod
metadata:
  name: nextflow
spec:
  containers:
  - name: nextflow
    # image: fabianlehmann/test1:nxf_v303
    # image: fabianlehmann/test1:nxf_vla_exp
    image: friedricht/nf-cws-ref:latest
    # image: friedricht/nf-cws-wow:latest
    # image: nf-adjusted:latest
    # image: nf-orig:latest
    imagePullPolicy: Never
    command:
      - /bin/sh
      - "-c"
      - "sleep infinity"
    workingDir: /experiments/experiment
    env:
    - name: NXF_WORK
      value: /input/data/work/
    - name: NXF_ANSI_LOG
      value: 'false'
    volumeMounts:
      - mountPath: /input
        name: input
      - mountPath: /experiments
        name: experiments
      - mountPath: /nfs
        name: nfs
      - mountPath: /localdata
        name: local
    securityContext:
      runAsUser: 0
    resources:
      requests: 
        memory: 3G
  nodeSelector:
    management: "true"
  serviceAccountName: la-nextflow
  volumes:
  - name: input
    persistentVolumeClaim:
      claimName: ceph-data
  - name: experiments
    persistentVolumeClaim:
      claimName: ceph-experiments
  - name: nfs
    persistentVolumeClaim:
      claimName: nfs-data
  - name: local
    hostPath:
      path: /localdata
  securityContext:
    runAsUser: 0
