apiVersion: v1
kind: Pod
metadata:
  labels:
    app: nextflow
    component: scheduler
    tier: control-plane
  name: workflow-scheduler
spec:
  containers:
  - env:
    - name: spring_profiles_active
      value: dev
    - name: SCHEDULER_NAME
      value: workflow-scheduler
    - name: AUTOCLOSE
      value: "false"
    image: fabianlehmann/test1:sch_v201
    # image: fabianlehmann/test1:sch_v303
    imagePullPolicy: Always
    name: workflow-scheduler
    resources:
      requests:
        cpu: "1"
        memory: 2000Mi
    volumeMounts:
    - mountPath: /input
      name: data
  nodeSelector: 
    management: 'true'
  securityContext:
    runAsUser: 0
  serviceAccount: cwsscheduleraccount
  volumes:
  - name: data
    persistentVolumeClaim:
      claimName: ceph-data
