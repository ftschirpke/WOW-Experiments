apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-data
spec:
  capacity:
    storage: 3700Gi 
  accessModes:
    - ReadWriteMany
  nfs:
    server: 10.0.0.18
    path: /data/nfs

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-data
  namespace: ftschirpke
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 3700Gi
  storageClassName: ""

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ceph-data
spec:
  storageClassName: cephfs
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 3000G

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ceph-exp
spec:
  storageClassName: cephfs
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 100G

