apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    friedrich: shell
  name: ft-nodes-for-cpupower
  namespace: ftschirpke
spec:
  selector:
    matchLabels:
      name: ft-nodes-for-cpupower
  template:
    metadata:
      labels:
        friedrich: cpupower-shell
        name: ft-nodes-for-cpupower
    spec:
      nodeSelector:
        usedby: ftschirpke
      containers:
        - name: shell
          image: docker.io/alpine:3.19
          command:
            - nsenter
          args:
            - '-t'
            - '1'
            - '-m'
            - '-u'
            - '-i'
            - '-n'
            - sleep
            - '14000'
          resources: {}
          volumeMounts:
            - name: kube-api-access-6wkgq
              readOnly: true
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
      terminationGracePeriodSeconds: 0
      dnsPolicy: ClusterFirst
      serviceAccountName: default
      serviceAccount: default
      hostNetwork: true
      hostPID: true
      hostIPC: true
      securityContext: {}
      schedulerName: default-scheduler
      tolerations:
        - operator: Exists
      priorityClassName: system-node-critical
      priority: 2000001000
      enableServiceLinks: true
      preemptionPolicy: PreemptLowerPriority
      volumes:
        - name: kube-api-access-6wkgq
          projected:
            sources:
              - serviceAccountToken:
                  expirationSeconds: 3607
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
            defaultMode: 420
